name: Deploy to Azure Dev

on:
  push:
    branches: [develop, azure-dev]
  pull_request:
    branches: [develop]

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: hulibdevacr
  IMAGE_NAME: hulib-web
  RESOURCE_GROUP: hulib-dev-rg
  CONTAINER_APP_NAME: hulib-dev-web

jobs:
  # =========================
  # CI / Validation
  # =========================
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate PR commits
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check:types

      - name: Unit tests
        run: npm run test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Storybook tests
        run: npm run test-storybook:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # =========================
  # Build Docker image
  # =========================
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    environment: azure-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        env:
          BACKEND_VERSION: ${{ vars.NEXT_PUBLIC_REACT_APP_BACKEND_VERSION }}
          BACKEND_ENDPOINT: ${{ vars.NEXT_PUBLIC_REACT_APP_BACKEND_ENDPOINT }}
          BACKEND_SOCKET_ENDPOINT: ${{ vars.NEXT_PUBLIC_REACT_APP_BACKEND_SOCKET_ENDPOINT }}
          EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          CONTACT_EMAIL: ${{ vars.NEXT_PUBLIC_CONTACT_EMAIL }}
          CONTACT_PHONE_NUMBER: ${{ vars.NEXT_PUBLIC_CONTACT_PHONE_NUMBER }}
          CLOUDINARY_CLOUD_NAME: ${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          UPLOAD_PRESET: ${{ vars.NEXT_PUBLIC_UPLOAD_PRESET }}
          AGORA_APP_ID: ${{ vars.NEXT_PUBLIC_AGORA_APP_ID }}
          APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}

        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:dev" \
            --build-arg "NEXT_PUBLIC_REACT_APP_BACKEND_VERSION=$BACKEND_VERSION" \
            --build-arg "NEXT_PUBLIC_REACT_APP_BACKEND_ENDPOINT=$BACKEND_ENDPOINT" \
            --build-arg "NEXT_PUBLIC_REACT_APP_BACKEND_SOCKET_ENDPOINT=$BACKEND_SOCKET_ENDPOINT" \
            --build-arg "NEXT_PUBLIC_EMAILJS_SERVICE_ID=$EMAILJS_SERVICE_ID" \
            --build-arg "NEXT_PUBLIC_EMAILJS_TEMPLATE_ID=$EMAILJS_TEMPLATE_ID" \
            --build-arg "NEXT_PUBLIC_EMAILJS_PUBLIC_KEY=$EMAILJS_PUBLIC_KEY" \
            --build-arg "NEXT_PUBLIC_CONTACT_EMAIL=$CONTACT_EMAIL" \
            --build-arg "NEXT_PUBLIC_CONTACT_PHONE_NUMBER=$CONTACT_PHONE_NUMBER" \
            --build-arg "NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=$CLOUDINARY_CLOUD_NAME" \
            --build-arg "NEXT_PUBLIC_UPLOAD_PRESET=$UPLOAD_PRESET" \
            --build-arg "NEXT_PUBLIC_AGORA_APP_ID=$AGORA_APP_ID" \
            --build-arg "NEXT_PUBLIC_APP_URL=$APP_URL" \
            --build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=$GA_MEASUREMENT_ID" \
            --build-arg "NEXT_PUBLIC_FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --build-arg "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$FIREBASE_AUTH_DOMAIN" \
            --build-arg "NEXT_PUBLIC_FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --build-arg "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET" \
            --build-arg "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --build-arg "NEXT_PUBLIC_FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            .

  # =========================
  # Deploy
  # =========================
  deploy:
    name: Deploy Container App
    runs-on: ubuntu-latest
    environment: azure-dev
    needs: [validate, build-image]

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"
