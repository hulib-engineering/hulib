name: Deploy to Azure Dev

on:
  push:
    branches: [develop, azure-dev]

concurrency:
  group: deploy-azure-dev
  cancel-in-progress: true

permissions:
  id-token: write # required for Azure OIDC login
  contents: read

env:
  ACR_NAME: hulibdevacr
  IMAGE_NAME: hulib-web
  RESOURCE_GROUP: hulib-dev-rg
  CONTAINER_APP_NAME: hulib-dev-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # NEXT_PUBLIC_* values are inlined into the client bundle at Next.js
      # build time, not read at container runtime -- they have to be passed
      # as build args here, not as Container App env vars. Reading from
      # secrets.* (not vars.*) because that's where they were actually
      # added on GitHub -- an earlier vars.* version silently resolved to
      # empty strings for all of them, failing Env.mjs's build-time
      # validation. They're still fine as GitHub secrets even though the
      # values end up public in the client bundle either way.
      - name: Build and push image
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --image ${{ env.IMAGE_NAME }}:dev \
            --build-arg NEXT_PUBLIC_REACT_APP_BACKEND_VERSION="${{ secrets.NEXT_PUBLIC_REACT_APP_BACKEND_VERSION }}" \
            --build-arg NEXT_PUBLIC_REACT_APP_BACKEND_ENDPOINT="${{ secrets.NEXT_PUBLIC_REACT_APP_BACKEND_ENDPOINT }}" \
            --build-arg NEXT_PUBLIC_REACT_APP_BACKEND_SOCKET_ENDPOINT="${{ secrets.NEXT_PUBLIC_REACT_APP_BACKEND_SOCKET_ENDPOINT }}" \
            --build-arg NEXT_PUBLIC_EMAILJS_SERVICE_ID="${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}" \
            --build-arg NEXT_PUBLIC_EMAILJS_TEMPLATE_ID="${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}" \
            --build-arg NEXT_PUBLIC_EMAILJS_PUBLIC_KEY="${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}" \
            --build-arg NEXT_PUBLIC_CONTACT_EMAIL="${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}" \
            --build-arg NEXT_PUBLIC_CONTACT_PHONE_NUMBER="${{ secrets.NEXT_PUBLIC_CONTACT_PHONE_NUMBER }}" \
            --build-arg NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME="${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}" \
            --build-arg NEXT_PUBLIC_UPLOAD_PRESET="${{ secrets.NEXT_PUBLIC_UPLOAD_PRESET }}" \
            --build-arg NEXT_PUBLIC_AGORA_APP_ID="${{ secrets.NEXT_PUBLIC_AGORA_APP_ID }}" \
            --build-arg NEXT_PUBLIC_APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL }}" \
            --build-arg NEXT_PUBLIC_GA_MEASUREMENT_ID="${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN="${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET="${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}" \
            --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}" \
            .

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
